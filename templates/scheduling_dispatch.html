<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduling Dispatch Request - Woods Comfort Systems</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 25px 30px;
            border-radius: 14px 14px 0 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .header h1 {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 5px;
            color: white;
        }
        .header p {
            opacity: 0.9;
            font-size: 0.95em;
            color: #cbd5e1;
        }
        .header .subtitle {
            font-style: italic;
            opacity: 0.9;
            margin-bottom: 10px;
            color: #cbd5e1;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: rgba(255,255,255,.85);
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color .15s;
        }
        .back-link:hover { color: #ffffff; }

        .form-content {
            padding: 30px;
        }

        .form-section {
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            background: #f8fafc;
        }
        .form-section h2 {
            color: #ffffff;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            padding: 12px 15px;
            background: #1e3a5f;
            margin: -20px -20px 18px -20px;
            border-radius: 10px 10px 0 0;
            border-bottom: 2px solid #3b82f6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-row.single { grid-template-columns: 1fr; }

        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 5px;
            font-size: 0.88em;
        }
        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="number"],
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95em;
            background: #ffffff;
            color: #1e293b;
            transition: border-color .15s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.15);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #9ca3af;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f9fafb;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: background .15s;
        }
        .checkbox-item:hover { background: #f0f4ff; }
        .checkbox-item input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
        }
        .checkbox-item label {
            cursor: pointer;
            user-select: none;
            flex: 1;
            font-weight: 500;
            color: #374151;
        }

        textarea { resize: vertical; min-height: 60px; }

        .submit-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }
        .btn-submit {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59,130,246,.3);
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59,130,246,.5);
        }
        .btn-submit:active { transform: translateY(0); }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .checkbox-grid { grid-template-columns: 1fr; }
        }
</style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-link">← Back to Forms</a>
            <h1>New Construction - Scheduling Dispatch Request</h1>
            <p>Woods Comfort Systems | TACLA16934C</p>
        </div>
        
        <div class="form-content">
            <form action="/generate-scheduling-dispatch-pdf" method="POST" id="scheduleForm">
                
                <!-- Basic Information -->
                <div class="form-section">
                    <h2>Basic Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="today_date">Today's Date:</label>
                            <input type="date" id="today_date" name="today_date" value="{{ today }}">
                        </div>
                        <div class="form-group">
                            <label for="date_needed">Date Needed:</label>
                            <input type="date" id="date_needed" name="date_needed">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="salesman">Salesman:</label>
                            <input type="text" id="salesman" name="salesman">
                        </div>
                        <div class="form-group">
                            <label for="field_super">WCSI Field Super:</label>
                            <input type="text" id="field_super" name="field_super">
                        </div>
                    </div>
                </div>
                
                <!-- Job Details -->
                <div class="form-section">
                    <h2>Job Details</h2>
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="builder">Builder:</label>
                            <input type="text" id="builder" name="builder">
                        </div>
                    </div>
                    
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="job_address">Job Address:</label>
                            <input type="text" id="job_address" name="job_address">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City:</label>
                            <input type="text" id="city" name="city">
                        </div>
                        <div class="form-group">
                            <label for="zip">Zip:</label>
                            <input type="text" id="zip" name="zip">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="plan_resident">Plan/Resident:</label>
                            <input type="text" id="plan_resident" name="plan_resident">
                        </div>
                        <div class="form-group">
                            <label for="subdivision">Subdivision:</label>
                            <input type="text" id="subdivision" name="subdivision">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="num_systems">Number of Systems:</label>
                            <input type="text" id="num_systems" name="num_systems">
                        </div>
                        <div class="form-group">
                            <label for="estimated_time">Estimated Time Needed:</label>
                            <input type="text" id="estimated_time" name="estimated_time">
                        </div>
                    </div>
                </div>
                
                <!-- Contact Information -->
                <div class="form-section">
                    <h2>Contact Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="gc_supervisor">GC Supervisor:</label>
                            <input type="text" id="gc_supervisor" name="gc_supervisor">
                        </div>
                        <div class="form-group">
                            <label for="lockbox_code">Lockbox/Gate Code:</label>
                            <input type="text" id="lockbox_code" name="lockbox_code">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="gc_phone">GC Supervisor Phone Number:</label>
                            <input type="tel" id="gc_phone" name="gc_phone">
                        </div>
                        <div class="form-group">
                            <label for="email">Builder/GC Super/Homeowner Email:</label>
                            <input type="email" id="email" name="email">
                        </div>
                    </div>
                </div>
                
                <!-- Rough In Checklist -->
                <div class="form-section">
                    <h2>Rough In Checklist</h2>
                    <div class="checkbox-grid">
                        <div class="checkbox-item">
                            <input type="checkbox" id="po_required" name="po_required">
                            <label for="po_required">PO Required</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="permit_needed" name="permit_needed">
                            <label for="permit_needed">Permit Needed</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="cornice_done" name="cornice_done">
                            <label for="cornice_done">Cornice Done</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="decked_dried" name="decked_dried">
                            <label for="decked_dried">Decked/Dried In</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="hvac_platform" name="hvac_platform">
                            <label for="hvac_platform">HVAC Platform</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="power_available" name="power_available">
                            <label for="power_available">Power Available</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="generator_needed" name="generator_needed">
                            <label for="generator_needed">Generator Needed</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="propane_gas" name="propane_gas">
                            <label for="propane_gas">Propane Gas Furnace/LP Conversion</label>
                        </div>
                    </div>
                </div>
                
                <!-- Notes -->
                <div class="form-section">
                    <h2>Notes</h2>
                    <div class="form-group">
                        <textarea id="notes" name="notes" placeholder="Enter any additional notes here..."></textarea>
                    </div>
                </div>
                
                <!-- Project Information -->
                <div class="form-section">
                    <h2>Project Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="wcsi_job_number">WCSI NC Job Number:</label>
                            <input type="text" id="wcsi_job_number" name="wcsi_job_number">
                        </div>
                        <div class="form-group">
                            <label for="permit_jurisdiction">Permit Jurisdiction:</label>
                            <input type="text" id="permit_jurisdiction" name="permit_jurisdiction">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="application_date">Application Date:</label>
                            <input type="date" id="application_date" name="application_date">
                        </div>
                        <div class="form-group">
                            <label for="permit_number">Permit Number:</label>
                            <input type="text" id="permit_number" name="permit_number">
                        </div>
                    </div>
                    
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="service_titan_number">Service Titan Project Number:</label>
                            <input type="text" id="service_titan_number" name="service_titan_number">
                        </div>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <div class="submit-section">
                    <button type="submit" class="btn-submit">📄 Generate PDF</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
