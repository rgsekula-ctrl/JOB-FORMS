<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Order (Pink Sheet) - Woods Comfort Systems</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 25px 30px;
            border-radius: 14px 14px 0 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .header h1 {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 5px;
            color: white;
        }
        .header p {
            opacity: 0.9;
            font-size: 0.95em;
            color: #cbd5e1;
        }
        .header .subtitle {
            font-style: italic;
            opacity: 0.9;
            margin-bottom: 10px;
            color: #cbd5e1;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: rgba(255,255,255,.85);
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color .15s;
        }
        .back-link:hover { color: #ffffff; }

        .form-content {
            padding: 30px;
        }

        .form-section {
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            background: #f8fafc;
        }
        .form-section h2 {
            color: #ffffff;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            padding: 12px 15px;
            background: #1e3a5f;
            margin: -20px -20px 18px -20px;
            border-radius: 10px 10px 0 0;
            border-bottom: 2px solid #3b82f6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-row.single { grid-template-columns: 1fr; }

        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 5px;
            font-size: 0.88em;
        }
        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="number"],
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95em;
            background: #ffffff;
            color: #1e293b;
            transition: border-color .15s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.15);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #9ca3af;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f9fafb;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: background .15s;
        }
        .checkbox-item:hover { background: #f0f4ff; }
        .checkbox-item input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
        }
        .checkbox-item label {
            cursor: pointer;
            user-select: none;
            flex: 1;
            font-weight: 500;
            color: #374151;
        }

        .checkbox-billing {
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            margin-top: 15px;
        }

        .amount-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .amount-input label { font-weight: 600; color: #374151; }
        .amount-input input {
            width: 120px;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #ffffff;
            color: #1e293b;
        }

        .equipment-table {
            margin-top: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }
        .equipment-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #1e3a5f;
            font-weight: 600;
            color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }
        .equipment-header div {
            padding: 12px;
            border-right: 1px solid #e5e7eb;
        }
        .equipment-header div:last-child { border-right: none; }
        .equipment-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid #e2e8f0;
        }
        .equipment-row:last-child { border-bottom: none; }
        .equipment-row input {
            padding: 10px;
            border: none;
            border-right: 1px solid #e5e7eb;
            font-size: 0.95em;
            background: transparent;
            color: #1e293b;
        }
        .equipment-row input:last-child { border-right: none; }
        .equipment-row input:focus {
            outline: none;
            background: rgba(59,130,246,.05);
        }
        .equipment-row input::placeholder { color: #9ca3af; }

        textarea { resize: vertical; min-height: 60px; }

        .submit-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }
        .btn-submit {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59,130,246,.3);
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59,130,246,.5);
        }
        .btn-submit:active { transform: translateY(0); }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
        }
</style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-link">← Back to Forms</a>
            <h1>WOODS COMFORT SYSTEMS</h1>
            <div class="subtitle">A Lifetime of Comfort</div>
            <p style="font-size: 1.1em; font-weight: 600;">CHANGES / UPGRADES / ADDITIONS (Pink Sheet)</p>
        </div>
        
        <div class="form-content">
            <form action="/generate-change-order-pdf" method="POST">
                
                <!-- Basic Information -->
                <div class="form-section">
                    <h2>Customer Information</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="customer_name">Customer Name:</label>
                            <input type="text" id="customer_name" name="customer_name">
                        </div>
                        <div class="form-group">
                            <label for="date">Date:</label>
                            <input type="date" id="date" name="date" value="{{ today }}">
                        </div>
                    </div>
                    
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="address">Address:</label>
                            <input type="text" id="address" name="address">
                        </div>
                    </div>
                    
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="city">City:</label>
                            <input type="text" id="city" name="city">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="job_number">Job #:</label>
                            <input type="text" id="job_number" name="job_number">
                        </div>
                        <div class="form-group">
                            <label for="plan_number">Plan #:</label>
                            <input type="text" id="plan_number" name="plan_number">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="called_in_by">Called In By / Builder:</label>
                            <input type="text" id="called_in_by" name="called_in_by">
                        </div>
                        <div class="form-group">
                            <label for="caller_contact">Phone / Email:</label>
                            <input type="text" id="caller_contact" name="caller_contact" placeholder="Phone or email...">
                        </div>
                    </div>

                    <div class="form-row single">
                        <div class="form-group">
                            <label for="taken_by">Taken by:</label>
                            <input type="text" id="taken_by" name="taken_by">
                        </div>
                    </div>
                    
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="work_needed">Work Needed:</label>
                            <textarea id="work_needed" name="work_needed"></textarea>
                        </div>
                    </div>
                </div>
                
                <!-- Equipment Being Returned -->
                <div class="form-section">
                    <h2>Equipment Being Returned</h2>
                    <div class="equipment-table">
                        <div class="equipment-header">
                            <div>Model #</div>
                            <div>Serial Number</div>
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="returned_model_0" placeholder="Model number...">
                            <input type="text" name="returned_serial_0" placeholder="Serial number...">
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="returned_model_1" placeholder="Model number...">
                            <input type="text" name="returned_serial_1" placeholder="Serial number...">
                        </div>
                    </div>
                    
                    <div class="form-row single" style="margin-top: 15px;">
                        <div class="form-group">
                            <label for="reason_return">Reason for return:</label>
                            <textarea id="reason_return" name="reason_return"></textarea>
                        </div>
                    </div>
                    
                    <div class="checkbox-billing">
                        <div class="checkbox-item">
                            <input type="checkbox" id="billable" name="billable">
                            <label for="billable">Billable?</label>
                        </div>
                        <div class="amount-input">
                            <label for="amount_bill">Amount to Bill:</label>
                            <input type="text" id="amount_bill" name="amount_bill" placeholder="$">
                        </div>
                        <div class="amount-input">
                            <label for="po_number">PO #:</label>
                            <input type="text" id="po_number" name="po_number">
                        </div>
                    </div>

                    <div class="form-row" style="margin-top: 15px;">
                        <div class="form-group">
                            <label for="date_requested">Date Requested:</label>
                            <input type="date" id="date_requested" name="date_requested">
                        </div>
                        <div class="form-group">
                            <label for="date_installed">Date to Be Installed:</label>
                            <input type="date" id="date_installed" name="date_installed">
                        </div>
                    </div>
                </div>
                
                <!-- New Equipment Sent Out -->
                <div class="form-section">
                    <h2>New Equipment Sent Out</h2>
                    <div class="equipment-table">
                        <div class="equipment-header">
                            <div>Model #</div>
                            <div>Serial Number</div>
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="new_model_0" placeholder="Model number...">
                            <input type="text" name="new_serial_0" placeholder="Serial number...">
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="new_model_1" placeholder="Model number...">
                            <input type="text" name="new_serial_1" placeholder="Serial number...">
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="new_model_2" placeholder="Model number...">
                            <input type="text" name="new_serial_2" placeholder="Serial number...">
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="new_model_3" placeholder="Model number...">
                            <input type="text" name="new_serial_3" placeholder="Serial number...">
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="new_model_4" placeholder="Model number...">
                            <input type="text" name="new_serial_4" placeholder="Serial number...">
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="new_model_5" placeholder="Model number...">
                            <input type="text" name="new_serial_5" placeholder="Serial number...">
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="new_model_6" placeholder="Model number...">
                            <input type="text" name="new_serial_6" placeholder="Serial number...">
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="new_model_7" placeholder="Model number...">
                            <input type="text" name="new_serial_7" placeholder="Serial number...">
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="new_model_8" placeholder="Model number...">
                            <input type="text" name="new_serial_8" placeholder="Serial number...">
                        </div>
                        <div class="equipment-row">
                            <input type="text" name="new_model_9" placeholder="Model number...">
                            <input type="text" name="new_serial_9" placeholder="Serial number...">
                        </div>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <div class="submit-section">
                    <button type="submit" class="btn-submit">📄 Generate PDF</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
