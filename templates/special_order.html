<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Order Request - Woods Comfort Systems</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 24px rgba(0,0,0,.08);
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 25px 30px;
            border-radius: 14px 14px 0 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .header h1 {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 5px;
            color: white;
        }
        .header p {
            opacity: 0.9;
            font-size: 0.95em;
            color: #cbd5e1;
        }
        .header .subtitle {
            font-style: italic;
            opacity: 0.9;
            margin-bottom: 10px;
            color: #cbd5e1;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: rgba(255,255,255,.85);
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color .15s;
        }
        .back-link:hover { color: #ffffff; }

        .form-content {
            padding: 30px;
        }

        .form-section {
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            background: #f8fafc;
        }
        .form-section h2 {
            color: #ffffff;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            padding: 12px 15px;
            background: #1e3a5f;
            margin: -20px -20px 18px -20px;
            border-radius: 10px 10px 0 0;
            border-bottom: 2px solid #3b82f6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-row.single { grid-template-columns: 1fr; }

        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 5px;
            font-size: 0.88em;
        }
        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group input[type="email"],
        .form-group input[type="tel"],
        .form-group input[type="number"],
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95em;
            background: #ffffff;
            color: #1e293b;
            transition: border-color .15s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.15);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #9ca3af;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f9fafb;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: background .15s;
        }
        .checkbox-item:hover { background: #f0f4ff; }
        .checkbox-item input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #3b82f6;
        }
        .checkbox-item label {
            cursor: pointer;
            user-select: none;
            flex: 1;
            font-weight: 500;
            color: #374151;
        }

        .checkbox-row {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .items-table {
            margin-top: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }
        .items-table-header {
            background: #1e3a5f;
            color: #ffffff;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1em;
            border-bottom: 1px solid #e2e8f0;
        }
        .items-table-content {
            max-height: 600px;
            overflow-y: auto;
        }
        .item-row {
            display: grid;
            grid-template-columns: 100px 1fr;
            border-bottom: 1px solid #e2e8f0;
        }
        .item-row:last-child { border-bottom: none; }
        .item-row input {
            padding: 12px;
            border: none;
            border-right: 1px solid #e5e7eb;
            font-size: 1em;
            background: transparent;
            color: #1e293b;
        }
        .item-row input:last-child { border-right: none; }
        .item-row input:focus {
            outline: none;
            background: rgba(59,130,246,.05);
        }
        .item-row input::placeholder { color: #9ca3af; }

        textarea { resize: vertical; min-height: 60px; }

        .submit-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }
        .btn-submit {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59,130,246,.3);
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59,130,246,.5);
        }
        .btn-submit:active { transform: translateY(0); }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
        }
</style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-link">← Back to Forms</a>
            <h1>New Construction Special Order Request Form</h1>
            <p>Woods Comfort Systems | TACLA16934C</p>
        </div>
        
        <div class="form-content">
            <form action="/generate-special-order-pdf" method="POST">
                
                <!-- Request Type Checkboxes -->
                <div class="checkbox-row">
                    <div class="checkbox-item">
                        <input type="checkbox" id="request_quote" name="request_quote">
                        <label for="request_quote">Request Quote</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="request_order" name="request_order">
                        <label for="request_order">Request Order</label>
                    </div>
                </div>
                
                <!-- Basic Information -->
                <div class="form-section">
                    <h2>Basic Information</h2>
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="address">Address:</label>
                            <input type="text" id="address" name="address">
                        </div>
                    </div>
                    
                    <div class="form-row single">
                        <div class="form-group">
                            <label for="builder">Builder:</label>
                            <input type="text" id="builder" name="builder">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="job_number">Job Number:</label>
                            <input type="text" id="job_number" name="job_number">
                        </div>
                        <div class="form-group">
                            <label for="date_request">Date of Request:</label>
                            <input type="date" id="date_request" name="date_request" value="{{ today }}">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="date_needed">Date Needed By:</label>
                            <input type="date" id="date_needed" name="date_needed">
                        </div>
                        <div class="form-group">
                            <label for="requested_by">Requested by:</label>
                            <input type="text" id="requested_by" name="requested_by">
                        </div>
                    </div>
                </div>
                
                <!-- Approval Status -->
                <div class="checkbox-row">
                    <div class="checkbox-item">
                        <input type="checkbox" id="approved" name="approved">
                        <label for="approved">Approved</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="retracted" name="retracted">
                        <label for="retracted">Retracted</label>
                    </div>
                </div>
                
                <!-- Order Details -->
                <div class="form-section">
                    <h2>Order Details</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="vendor">Vendor:</label>
                            <input type="text" id="vendor" name="vendor">
                        </div>
                        <div class="form-group">
                            <label for="tracking_number">Tracking Number:</label>
                            <input type="text" id="tracking_number" name="tracking_number">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="quote_number">Quote Number:</label>
                            <input type="text" id="quote_number" name="quote_number">
                        </div>
                        <div class="form-group">
                            <label for="order_date">Order Date:</label>
                            <input type="date" id="order_date" name="order_date">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="quoted_cost">Quoted Cost:</label>
                            <input type="text" id="quoted_cost" name="quoted_cost" placeholder="$">
                        </div>
                        <div class="form-group">
                            <label for="eta">ETA:</label>
                            <input type="date" id="eta" name="eta">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="shipping_cost">Shipping Cost:</label>
                            <input type="text" id="shipping_cost" name="shipping_cost" placeholder="$">
                        </div>
                        <div class="form-group">
                            <label for="po_number">PO Number:</label>
                            <input type="text" id="po_number" name="po_number">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                        </div>
                        <div class="form-group">
                            <label for="arrival_date">Arrival Date:</label>
                            <input type="date" id="arrival_date" name="arrival_date">
                        </div>
                    </div>
                </div>
                
                <!-- Items Table -->
                <div class="form-section">
                    <h2>Items to Order</h2>
                    <div class="items-table">
                        <div class="items-table-header">
                            Item Description
                        </div>
                        <div class="items-table-content">
                            <!-- Generate 20 rows -->
                            <div class="item-row">
                                <input type="text" name="qty_0" placeholder="QTY" style="text-align: center; font-weight: 600;">
                                <input type="text" name="description_0" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_1" placeholder="QTY">
                                <input type="text" name="description_1" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_2" placeholder="QTY">
                                <input type="text" name="description_2" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_3" placeholder="QTY">
                                <input type="text" name="description_3" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_4" placeholder="QTY">
                                <input type="text" name="description_4" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_5" placeholder="QTY">
                                <input type="text" name="description_5" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_6" placeholder="QTY">
                                <input type="text" name="description_6" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_7" placeholder="QTY">
                                <input type="text" name="description_7" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_8" placeholder="QTY">
                                <input type="text" name="description_8" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_9" placeholder="QTY">
                                <input type="text" name="description_9" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_10" placeholder="QTY">
                                <input type="text" name="description_10" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_11" placeholder="QTY">
                                <input type="text" name="description_11" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_12" placeholder="QTY">
                                <input type="text" name="description_12" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_13" placeholder="QTY">
                                <input type="text" name="description_13" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_14" placeholder="QTY">
                                <input type="text" name="description_14" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_15" placeholder="QTY">
                                <input type="text" name="description_15" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_16" placeholder="QTY">
                                <input type="text" name="description_16" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_17" placeholder="QTY">
                                <input type="text" name="description_17" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_18" placeholder="QTY">
                                <input type="text" name="description_18" placeholder="Item description...">
                            </div>
                            <div class="item-row">
                                <input type="text" name="qty_19" placeholder="QTY">
                                <input type="text" name="description_19" placeholder="Item description...">
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <div class="submit-section">
                    <button type="submit" class="btn-submit">📄 Generate PDF</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
